name: Notification API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.25.x', stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: make check test
  build:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build small standalone Linux service
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: make build
      - name: Exercise native binary without root privileges
        if: matrix.arch == 'amd64'
        run: python3 tests/smoke.py bin/release-notify
      - name: Checksum artifact
        run: cd bin && sha256sum release-notify > release-notify.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: release-notify-linux-${{ matrix.arch }}
          path: bin/*
          retention-days: 14
          if-no-files-found: error
